
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthguard
      POSTGRES_USER: healthguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthguard -d healthguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthguard-private

  redis:
    image: redis:7-alpine
    container_name: healthguard-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no'
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - healthguard-private

  app:
    image: 639175159804.dkr.ecr.eu-north-1.amazonaws.com/healthguard-backend:aws-validated-2026-11-14-v3
    container_name: healthguard-api
    restart: unless-stopped
    env_file:
      - ./app.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - healthguard-private

  caddy:
    image: caddy:2
    container_name: healthguard-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - healthguard-private

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  healthguard-private:
    driver: bridge

