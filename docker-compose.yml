services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthguard-postgres

    environment:
      POSTGRES_DB: healthguard
      POSTGRES_USER: healthguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}


    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: healthguard-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no'

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
