
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthguard
      POSTGRES_USER: healthguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthguard -d healthguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthguard-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no'
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: healthguard-api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
